name: Build SecureLock AI (APK & AAB)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Android project root
        id: android
        run: |
          if [ -f "android-project/settings.gradle.kts" ]; then
            echo "dir=android-project" >> "$GITHUB_OUTPUT"
          elif [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "Could not find settings.gradle.kts in root or android-project/"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK Licenses & Install API 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          gradle-home-cache-cleanup: true

      - name: Decode optional release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set; building signed Debug APK + unsigned Release APK/AAB."
          fi

      - name: Run Unit Tests & Build APK / AAB
        working-directory: ${{ steps.android.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle testDebugUnitTest assembleDebug bundleRelease --no-daemon --stacktrace
          gradle assembleRelease -PenableAbiSplits=true --no-daemon --stacktrace

      - name: Upload Installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureLockAI-Debug-APK
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: SecureLockAI-Release-APKs
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Play Store Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: SecureLockAI-PlayStore-AAB
          path: ${{ steps.android.outputs.dir }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
