name: Build SecureLock AI (Signed APK & AAB)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build 2 Files (Signed APK & Signed AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK Licenses & Install API 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          gradle-home-cache-cleanup: true

      - name: Configure release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ runner.temp }}/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias securelock_ci \
              -storepass securelock_ci_pass \
              -keypass securelock_ci_pass \
              -dname "CN=SecureLock AI, OU=Security, O=SecureLock, L=Local, ST=NA, C=US"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=securelock_ci_pass" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=securelock_ci" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=securelock_ci_pass" >> "$GITHUB_ENV"
          fi

      - name: Build Signed APK & Signed AAB
        run: |
          gradle testFullDebugUnitTest assembleSideloadRelease bundleFullRelease --no-daemon --stacktrace
          mkdir -p build/final-outputs
          cp app/build/outputs/apk/sideload/release/*.apk build/final-outputs/SecureLockAI-Signed.apk
          cp app/build/outputs/bundle/fullRelease/*.aab build/final-outputs/SecureLockAI-Signed.aab

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureLockAI-Signed-APK
          path: build/final-outputs/SecureLockAI-Signed.apk
          if-no-files-found: error

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SecureLockAI-Signed-AAB
          path: build/final-outputs/SecureLockAI-Signed.aab
          if-no-files-found: error
